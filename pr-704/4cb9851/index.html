<main><h1>#704 界面预览</h1><p class="m">commit 4cb9851 · <a href="https://github.com/yetone/magpie/pull/704">回到 PR</a> · 用量页顶部新增「分析」入口，打开独立的「质量与分析」看板（#view-analytics）：周期/维度分段与模型、供应商、Agent 筛选，可靠性（成功率、429/5xx、错误率、异常趋势）、响应速度（TTFT P95、TPS）、费用与缓存率的 KPI 与排行条；点排行行或 KPI 进入左右两栏下钻页（左侧紧凑排行、右侧前 50 条调用，点调用在右侧内嵌路由过程），下钻页标题行新增「隐藏账号」按钮，账号打码也覆盖分析页的文本、title 与 aria-label。</p>
