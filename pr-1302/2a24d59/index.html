<main><h1>#1302 界面预览</h1><p class="m">commit 2a24d59 · <a href="https://github.com/yetone/magpie/pull/1302">回到 PR</a> · 在 Agent 列表页脚的折叠控件旁新增「管理」按钮，点开批量管理对话框：可按名称/ID 搜索、全选或反选搜索结果、选择未接入项、清空选择，并批量隐藏或取消隐藏所选 Agent，每行显示可见状态与已选数量。另外 Plugins 页的 npm 搜索结果改为原位更新，避免建议卡片在点击瞬间被重建。</p>
