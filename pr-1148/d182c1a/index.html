<main><h1>#1148 界面预览</h1><p class="m">commit d182c1a · <a href="https://github.com/yetone/magpie/pull/1148">回到 PR</a> · 改的是设置页保存代理时的行为：当更新检查此前失败、用户又改了代理，POST /api/settings 现在先调用 begin() 把状态标成「检查中」，再异步重跑检查，于是保存在后立刻读取 /api/update 的页面画出来的是正在检查，而不是那条不会再自动轮询的旧错误。</p>
