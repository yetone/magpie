name: test
on: push
jobs:
  alone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null
      - run: go test -race -tags gtk3 ./internal/gateway/ -run '^TestSealedTaskGoesToTheLeadsLoggedAccountFirst$' -count=60 2>&1 | tee alone.log | grep -aE -- "DIAG|--- FAIL|^ok|^FAIL|tried" | sort | uniq -c | head -40
  shards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null
      - uses: oven-sh/setup-bun@v2
      - run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" -tags gtk3 ./internal/gateway/
          for i in 1 2; do build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.race" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=20m > "shards-$i.log" 2>&1; echo "round $i exit $?"; grep -aE -- "DIAG|--- FAIL" "shards-$i.log" | sort | uniq -c | head -20; done
