name: test
on: push
jobs:
  chunk:
    strategy:
      matrix:
        k: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update >/dev/null && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null
      - uses: oven-sh/setup-bun@v2
      - run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" -tags gtk3 ./internal/gateway/
          cd internal/gateway
          for i in $(seq 1 12); do
            "$RUNNER_TEMP/gateway.race" -test.run '^(TestAccountLimitSharedAcrossGroups|TestAntigravityEnvelopeIsNamedAsTheLedgerJudgesIt|TestBareNameGoesToTheAgentsOwnSubscription|TestCensorshipBlockedIsAPolicyRefusal|TestClassifierGroupPinnedEveryRouting|TestClaudeIdleRunKeptWhileItsCacheLasts|TestClaudeTUIAdvisorAnsweredHere|TestCodeAssistToolImagesAfterEveryResponse|TestCodexImagesThatFitGoAsTheyCame|TestCodexRelayedImageWindowHeard|TestConcurrentClassificationSharesFailure|TestDeepSeekFilesKeptOnDisk|TestEffortTheAccountListsLacks|TestGatewayConversationCodexDirectRelay|TestGrokCallsGiveIntegersOnEveryProtocol|TestHeldLimitAskedAgainInAMinute|TestInOrderStillGoesByTheListOverTheFreeOne|TestKimiCodeSearchAddress|TestManyImagesDescribedOnce|TestModelScopeNativeIsResponses|TestOTelWholeWaterfallFallback|TestPassErrorsAskedOnce|TestPolicyRefusalOneAccountRelayed|TestReasonixConversationsInOneWorkspaceAreApart|TestRemoteMagpieRoutedFailureNotAskedAgain|TestResponsesToClaudeMarksLastAnHour|TestSealedTaskGoesBackToTheRelayThatSealedIt|TestSealedTaskGoesToTheLeadsLoggedAccountFirst|TestSilentHTTP2ConnectionIsDropped|TestSwappedModel|TestToolsThatNeedResponsesGoThere|TestUnroutedUnknownHoldAnsweredSooner|TestWSLViaCallerServed|TestWSLViaListenerLetsInWindowsAndWSLOnly)$' -test.v -test.timeout=20m > ../../c-$i.log 2>&1; echo "round $i exit $?"
            grep -aE -- "DIAG|--- FAIL|tried \[" ../../c-$i.log | head -10
            grep -aE -- "^=== RUN   Test[A-Za-z0-9]+$" ../../c-$i.log | sed -n '/LeadsLogged/{x;p;d};x' | head -3
          done
