name: Release

# Formal signed releases live at yetone/magpie-releases. This fork publishes
# unsigned packages via jd-release.yml instead — keep this workflow disabled
# so a v* tag never dispatches upstream.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Formal release is disabled on this fork — use JD Release'
        required: false
        type: string

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Formal release disabled
        run: |
          echo "::error::Formal release (yetone/magpie-releases) is disabled on this fork."
          echo "Use the JD Release workflow to publish unsigned packages."
          exit 1
