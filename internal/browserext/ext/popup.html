<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --mute: #6e6e73; --line: #d2d2d7; --bg: #fff; --ok: #34c759; --off: #8e8e93; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --mute: #98989d; --line: #3a3a3c; --bg: #1c1c1e; } }
  body { margin: 0; width: 280px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { padding: 14px; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 18px; height: 18px; }
  .state { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--ok); }
  p { margin: 8px 0 0; color: var(--mute); font-size: 12px; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: default; color: var(--mute); font-size: 12px; }
  label { display: block; margin-top: 8px; font-size: 12px; color: var(--mute); }
  input { box-sizing: border-box; width: 100%; margin-top: 4px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
  button { margin-top: 8px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
</style>
</head>
<body>
<main>
  <h1><img src="icon-32.png" alt="">Magpie Browser</h1>
  <div class="state"><span class="dot" id="dot"></span><span id="state">…</span></div>
  <p id="hint"></p>
  <details>
    <summary>Gateway</summary>
    <label for="gw">Magpie's address</label>
    <input id="gw" spellcheck="false">
    <label for="key" id="keyLabel">Gateway key</label>
    <input id="key" type="password" spellcheck="false" autocomplete="off">
    <button id="save">Save and reconnect</button>
  </details>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
