<main><h1>#1128 界面预览</h1><p class="m">commit c1a4ca8 · <a href="https://github.com/yetone/magpie/pull/1128">回到 PR</a> · 本次改动让 Bub 成为 magpie 支持的 Agent：Agent 页（以及快捷面板）多出 Bub 一行，带 Bub 的 logo 图标，并给它两个可编辑字段——model（可选自家模型，也可选 magpie 的模型）与 effort（reasoning effort）。选 magpie 的模型时会把 magpie 作为 provider 写进 ~/.bub/config.yml；Bub 未安装时则出现在「安装其他 Agent」列表里。</p>
