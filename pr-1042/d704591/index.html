<main><h1>#1042 界面预览</h1><p class="m">commit d704591 · <a href="https://github.com/yetone/magpie/pull/1042">回到 PR</a> · macOS 26 上主窗口不再用带工具栏的标题栏：窗口圆角变成普通标题栏那种（TextEdit 的小圆角），同时把红绿灯位置、标题栏高度、sheet 起点和「另一应用在前时第一次按下即拖动窗口」的判定保留在原来工具栏的位置；判定在运行时读 macOS 版本、SDK 与 Info.plist，只在 macOS 26 且以 macOS 26 SDK 链接时生效。页面本身没有任何改动。</p>
